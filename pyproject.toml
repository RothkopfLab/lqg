[project]
name = "lqg"
version = "0.2.13"
description = "(Inverse) optimal control for linear-quadratic Gaussian systems"
authors = [{ name = "Dominik Straub", email = "dominikstrb@mailbox.org" }]
requires-python = ">=3.10"
readme = "docs/README.md"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jax>=0.4.13",
    "numpyro>=0.12.1",
    "optimistix>=0.0.10",
    "matplotlib>=3.2.2",
    "arviz>=0.16.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "ipywidgets>=8.1.8",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "jupyter>=1.0.0,<2",
    "pytest>=7.4.4",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]
docs = [
    "altair>=6.2.2",
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "pandas>=2.3.3",
]
test = []

[tool.uv]
default-groups = "all"

[tool.deptry.per_rule_ignores]
DEP004 = ["altair", "pandas"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"
